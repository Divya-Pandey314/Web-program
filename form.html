<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 Fieldset Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        fieldset {
            margin-bottom: 20px;
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
        legend {
            font-weight: bold;
            padding: 0 10px;
        }
        label {
            display: block;
            margin-top: 8px;
        }
        input, select {
            padding: 5px;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            background-color: #cd6cce;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<h2>Sample Form</h2>

<form>
    <!-- 1: General Information -->
    <fieldset>
        <legend>General Information</legend>
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="contact number">Contact Number:</label>
        <input type="contact number" id="contact number" name="conttact number" placeholder="XXX-XXX-XXXX" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
    </fieldset>

    <!-- 2: Gender -->
    <fieldset>
        <legend>Gender</legend>
        <label>
            <input type="radio" name="gender" value="male"> Male
        </label>
        <label>
            <input type="radio" name="gender" value="female"> Female
        </label>
        <label>
            <input type="radio" name="gender" value="other"> Other
        </label>
    </fieldset>

    <!-- 3: Age -->
    <fieldset>
        <legend>Education</legend>
        <label for="education">Enter your previous school:</label>
        <input type="text" id="education" name="education">
        <label for="education1">Enter your grade:</label>
        <input type="text" id="education1" name="education">
        


    </fieldset>

    <!-- 4: Date of Birth -->
    <fieldset>
        <legend>Date of Birth</legend>
        <label for="dob">Select your date of birth:</label>
        <input type="date" id="dob" name="dob">
    </fieldset>

    <button type="submit">Submit</button>
</form>

</body>
</html>
