<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Salicylic Acid Serum</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background-color: #f9f9f9;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      display: flex;
      flex-wrap: wrap;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .left-column, .right-column {
      flex: 1;
      padding: 20px;
    }

    .left-column img {
      width: 100%;
      max-width: 400px;
      border-radius: 8px;
    }

    .right-column h1 {
      margin-top: 0;
    }

    .stars {
      color: gold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .size-select button {
      border: 2px solid #ff6b00;
      padding: 5px 15px;
      margin-right: 10px;
      border-radius: 5px;
      background: white;
      cursor: pointer;
    }

    .quantity {
      margin: 15px 0;
    }

    .quantity input {
      width: 40px;
      text-align: center;
    }

    .add-to-bag {
      background-color: #000;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      border: 2px solid #ff6b00;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }

    .description {
      margin-top: 30px;
    }

    a.back-link {
      display: inline-block;
      margin-top: 30px;
      text-decoration: none;
      color: #555;
    }

    .price {
  color: orange;
  font-weight: bold;
  font-size: 18px;
}

  </style>
</head>
<body>

  <div class="container">

    <div class="left-column">
      <img src="https://www.epharmacy.com.np/content/images/thumbs/65263dc3e0498d9868cd63aa_the-derma-co-2-salicylic-acid-face-serum-10ml.jpeg" 
      alt="Salicylic Serum">
    </div>

    <div class="right-column">
      <h1>2% Salicylic Acid Serum</h1>
      <p><em>Targets breakouts and unclogs pores</em></p>


      <div class="size-select">
        <button>Mini</button>
        <button>Full</button>
      </div>

      <div class="quantity">
        Quantity: 
        <button onclick="decrease()">-</button>
        <input type="number" id="qty" value="1" min="1">
        <button onclick="increase()">+</button>
      </div>

    <p class="price">Rs. 950</p>


      <div class="description">
        <h3>Description</h3>

        <p>
          A gentle yet effective exfoliating serum with 2% salicylic acid to clear acne, 
          reduce blackheads, and improve skin texture.

        </p>
        
      </div>

      <a href="index1.html" class="back-link">← Back to Main Page</a>
    </div>

  </div>

  <script>
    function increase() {
      var qty = document.getElementById("qty");
      qty.value = parseInt(qty.value) + 1;
    }

    function decrease() {
      var qty = document.getElementById("qty");
      if (qty.value > 1) qty.value = parseInt(qty.value) - 1;
    }
  </script>

</body>
</html>
